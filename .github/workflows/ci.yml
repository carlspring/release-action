name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt flake8

      - name: Check syntax
        run: python -m py_compile scripts/release.py

      - name: Lint
        run: flake8 scripts/release.py --max-line-length=100
